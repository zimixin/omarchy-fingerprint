<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Mono-color fingerprint icon. The bar colorizes every white pixel at
       runtime (MultiEffect colorization), so keep it single-color. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- pad outline -->
    <ellipse cx="12" cy="13.5" rx="9.2" ry="10.2" stroke-width="2.3"/>
    <!-- capillary arches (concentric arcs opening downward, like a real print) -->
    <path d="M 6.4,6.4 Q 12,3.4 17.6,6.4"/>
    <path d="M 5.4,9.6 Q 12,7.0 18.6,9.6"/>
    <path d="M 5.2,12.6 Q 12,10.6 18.8,12.6"/>
    <path d="M 6.0,15.6 Q 12,14.4 18.0,15.6"/>
    <path d="M 7.6,18.0 Q 12,17.4 16.4,18.0"/>
  </g>
</svg>